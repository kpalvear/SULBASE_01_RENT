name = "rent"
main = "src/server/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# SPA (Vite) + API Hono en /api/* — Postgres vía Supabase pooler o Hyperdrive
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
DEV_ORGANIZATION_SLUG = "dev"

[observability]
enabled = true

[observability.logs]
enabled = true

# Opcional en producción: crea Hyperdrive apuntando al pooler de Supabase y descomenta.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-config-id>"
